name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布的版本号，例如 v1.5.3'
        required: true
        default: 'v1.5.3'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            artifactName: FocusMyTime-Windows-Setup
            artifactPath: FocusMyTime-Windows-Setup.exe
          - os: ubuntu-latest
            platform: android
            artifactName: FocusMyTime-Android
            artifactPath: FocusMyTime-Android.apk
          - os: ubuntu-latest
            platform: web
            artifactName: FocusMyTime-Web
            artifactPath: FocusMyTime-Web.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          server_version="$(node -p "require('./server/package.json').version")"
          installer_version="$(sed -n 's/^AppVersion=//p' windows/packaging/inno_setup.iss)"
          readme_version="$(sed -n 's/^当前版本：v\([^ ]*\).*/\1/p' README.md)"

          if [ "$RELEASE_VERSION" != "v$app_version" ]; then
            echo "Release version $RELEASE_VERSION does not match pubspec version v$app_version."
            exit 1
          fi

          for version in "$server_version" "$installer_version" "$readme_version"; do
            if [ "$version" != "$app_version" ]; then
              echo "Project version $version does not match pubspec version $app_version."
              exit 1
            fi
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        if: matrix.platform == 'windows'
        run: flutter config --enable-windows-desktop

      - name: Prepare Android release signing
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are required to publish an upgradeable APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build Windows application
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Bundle Visual C++ runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./windows/packaging/bundle_msvc_runtime.ps1 -Destination "build/windows/x64/runner/Release"

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\packaging\inno_setup.iss'

      - name: Build Android APK
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Rename Android APK
        if: matrix.platform == 'android'
        run: mv build/app/outputs/flutter-apk/app-release.apk FocusMyTime-Android.apk

      - name: Build Web application
        if: matrix.platform == 'web'
        run: flutter build web --release

      - name: Package Web application
        if: matrix.platform == 'web'
        shell: bash
        run: |
          cd build/web
          zip -r ../../FocusMyTime-Web.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
