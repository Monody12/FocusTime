name: focus_my_time
description: "FocusMyTime - 番茄工作法 + 单核工作法计时器"
publish_to: 'none'
version: 1.8.3+41

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.0

  # 数据库
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.8.0

  # 导航
  go_router: ^12.0.0

  # 通知
  flutter_local_notifications: ^17.2.4

  # 音频
  audioplayers: ^6.8.1

  # 本地存储
  shared_preferences: ^2.5.4

  # 网络（云同步）
  http: ^1.1.0

  # UUID
  uuid: ^4.2.0

  # intl 日期格式化
  intl: ^0.19.0
  windows_notification: ^1.3.0
  timezone: ^0.9.2
  flutter_timezone: ^5.1.0
  permission_handler: ^12.0.3
  device_calendar: ^4.3.2
  package_info_plus: ^9.0.1
  file_picker: ^11.0.2
  web: ^1.1.1
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  url_launcher: ^6.3.1
  sqlite3_flutter_libs: ^0.5.42
  markdown: ^7.3.1
  image: ^4.9.2
  path_provider: ^2.1.6
  highlight: ^0.7.0
  desktop_drop: ^0.8.2
  super_clipboard: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/fonts/OFL-1.1.txt
    - assets/fonts/NOTICE.txt
  fonts:
    - family: FocusNotoSansSC
      fonts:
        - asset: assets/fonts/FocusNotoSansSC-UI.ttf
